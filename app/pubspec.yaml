name: vocabnote
description: VocabNote — offline-first AI vocabulary notebook.
publish_to: none
resolution: workspace
version: 4.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  core_design_system:
    path: ../core/design_system
  feature_enrich:
    path: ../features/enrich
  feature_notebook:
    path: ../features/notebook
  feature_quiz:
    path: ../features/quiz
  feature_settings:
    path: ../features/settings
  feature_transfer:
    path: ../features/transfer
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  shared_preferences: ^2.5.2
  window_manager: ^0.4.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Official icon artwork, bundled so in-app surfaces (the About page)
  # show the exact same icon the Windows executable uses.
  assets:
    - assets/icon/app_icon.png

# App icon generation (`dart run flutter_launcher_icons` from app/).
# The generated multi-resolution .ico replaces
# windows/runner/resources/app_icon.ico (a pre-generated copy is already
# committed, so this only needs re-running when the icon artwork changes).
flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
