name: vocabnote

packages:
  - app
  - core/*
  - features/*

command:
  bootstrap:
    environment:
      sdk: ">=3.6.0 <4.0.0"
      flutter: ">=3.44.0"

scripts:
  analyze:
    description: Run static analysis in every package.
    run: dart analyze --fatal-infos .
    exec:
      concurrency: 4

  format:
    description: Verify formatting in every package.
    run: dart format --set-exit-if-changed .

  gen:
    description: Run codegen (drift, freezed, riverpod) where needed.
    run: dart run build_runner build --delete-conflicting-outputs
    exec:
      concurrency: 1
    packageFilters:
      dependsOn: build_runner

  gen:watch:
    description: Watch-mode codegen for the package in CWD.
    run: dart run build_runner watch --delete-conflicting-outputs

  test:
    description: Run tests in every package that has them.
    run: flutter test
    exec:
      concurrency: 1
    packageFilters:
      dirExists: test
